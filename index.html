<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050912">
  <meta name="description" content="VINCELS: wallpapers verticales, música con IA y contenido digital.">
  <title>VINCELS. — Tu mundo digital</title>
  <style>
    :root {
      --bg: #050912; --panel: #0b1220; --panel2: #101a2a;
      --cyan: #00d9ff; --purple: #a855f7; --text: #f4f8ff;
      --muted: #a5b4c9; --line: rgba(95, 170, 220, .23);
      --glow: 0 0 24px rgba(0,217,255,.16);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; color: var(--text); background:
        radial-gradient(ellipse at 70% 0%, rgba(0,91,160,.16), transparent 35%),
        linear-gradient(180deg, #050912, #070b15 60%, #03060c);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    .topbar {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
      justify-content: space-between; gap: 18px; padding: 15px clamp(16px, 4vw, 52px);
      background: rgba(4,9,17,.88); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .logo { font-size: clamp(1.35rem, 3vw, 1.8rem); font-weight: 850; letter-spacing: .11em; }
    .logo span { color: var(--cyan); }
    .nav-links { display: flex; gap: 9px; align-items: center; }
    .nav-links a, .menu-panel a { padding: 10px 13px; border-radius: 999px; color: #d8e4f3; font-size: .9rem; }
    .nav-links a:hover, .nav-links a.active { border: 1px solid var(--cyan); color: white; box-shadow: var(--glow); }
    .menu-wrap { position: relative; }
    .menu-button {
      display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
      color: white; border: 1px solid var(--line); background: #0b1422; font-size: 1.35rem;
    }
    .menu-panel {
      display: none; position: absolute; right: 0; top: 54px; min-width: 190px; padding: 8px;
      background: #0b1220; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 45px #0009;
    }
    .menu-panel.open { display: grid; }
    .menu-panel a { border-radius: 10px; }
    .menu-panel a:hover { background: #122339; color: var(--cyan); }
